<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Age Gap Supplementary Tables</title>
<meta name="description" content="Interactive supplementary tables for 'Shared genetic architecture of brain age gap across 30 cohorts worldwide' (Baltramonaityte et al.).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,500&display=swap">
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-title">
      <p class="eyebrow">Supplementary tables</p>
      <h1>Shared genetic architecture of brain age gap across 30 cohorts worldwide</h1>
      <p class="byline">Baltramonaityte et al. · ENIGMA Brain Age consortium</p>
    </div>
    <nav class="links" aria-label="Project links">
      <a id="link-paper" href="#" target="_blank" rel="noopener">Preprint</a>
      <a id="link-repo" href="#" target="_blank" rel="noopener">Code on GitHub</a>
      <a id="link-xlsx" href="data/supplementary_tables.xlsx" download>Download all tables (.xlsx)</a>
    </nav>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="Tables">
    <label class="find" for="global-q">
      <span class="label">Search all tables</span>
      <input id="global-q" type="search" placeholder="Gene, SNP, trait, cohort…" autocomplete="off" spellcheck="false">
    </label>
    <div id="global-results" class="global-results" hidden></div>
    <select id="table-select" class="table-select" aria-label="Choose a table"></select>
    <nav id="toc" class="toc"></nav>
  </aside>

  <main id="main" class="main">
    <div class="loading">Loading tables…</div>
  </main>
</div>

<aside id="drawer" class="drawer" hidden aria-label="Row details">
  <div class="drawer-head">
    <strong id="drawer-title">Row details</strong>
    <button id="drawer-close" class="btn ghost" type="button" aria-label="Close details">Close</button>
  </div>
  <dl id="drawer-body" class="drawer-body"></dl>
</aside>

<!-- Optional chart views; delete the next line to turn charts off -->
<script src="assets/charts.js?v=4"></script>
<script src="assets/app.js?v=3"></script>
</body>
</html>
